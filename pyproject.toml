[project]
name = "alphaagent"
version = "0.1.0"
description = "??????? + ????"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0,<3",
    "pyarrow>=14",
    "numpy>=1.24,<2",
    "pyparsing>=3.2",
    "numba>=0.59",
    "joblib>=1.4",
    "tushare>=1.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
model = ["lightgbm>=4.0", "scikit-learn>=1.4"]
mining = ["openai>=1.0", "agentscope>=2.0.0"]
qmt = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default-groups = ["dev"]
